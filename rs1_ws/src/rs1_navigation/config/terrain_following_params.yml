/parrot1/terrain_following_node:
  ros__parameters:
    use_sim_time: true

    target_clearance: 2.0 # metres above the surface, measured using the downward lidar
    control_rate_hz: 20.0 # control-loop frequency
    scan_timeout: 0.25 # seconds
    cmd_vel_timeout: 0.25 # seconds

    kp: 1.0 # proportional gain
    max_vertical_speed: 2.0 # m/s, applied to both climb and descent (fast duck/pop recoveries)

    # Ground-relative altitude control.  The downward lidar only sees the nearest
    # surface (ground OR canopy), so holding clearance above it made the drone
    # ratchet up over every tree until it was above the canopy.  Instead we fly
    # `target_clearance` above a running-minimum ground estimate:
    ground_rise_rate: 0.15 # m/s; how fast the ground estimate may rise (follows hills, ignores tree tops)
    min_clearance: 0.5 # m; never descend closer than this to whatever is directly below
    # NOTE: must stay BELOW the executor's `duck_clearance` (0.8 m), otherwise
    # the clamp stops the duck at min_clearance and the drone never gets under
    # the oak branch band (which starts ~1.2 m above the ground).
