# Teleports the parrot around the v2_forest world and collects one YOLO sample
# per viewpoint. The labelled trees are already in the world, so no model
# spawning/moving is required - this node only moves the drone and asks the
# camera_collector to capture the current frame.
parrot_patrol_node:
  ros__parameters:
    world_name: "v2_forest"
    parrot_model_name: "parrot1"
    derive_from_trees: true          # derive viewpoints from the labelled tree TFs
    num_viewpoints: 0                # 0 = visit every labelled tree once
    view_distance: 15.0              # horizontal distance camera -> tree (m)
    camera_height: 3.0               # camera altitude above the tree base (m)
    min_altitude: 2.0                # absolute floor for the viewpoint z
    min_clearance: 4.0               # min dist from viewpoint to any other tree base (m)
    max_viewpoint_tries: 30          # random angles tried per tree before skipping
    min_trees: 50                    # wait until at least this many trees have been discovered
