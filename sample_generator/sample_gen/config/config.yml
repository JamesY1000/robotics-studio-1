    waypoints_key: "parrot_waypoints"
    wait_after_teleport: 0.5
    max_collect_retries: 500
    num_passes: 3                     # full passes over the waypoints (upper bound)
    target_samples: 400               # stop once this many samples exist (resume-aware)
    seed: 0
